<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Pro - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-users-cog"></i>
                <span>HRMS Pro</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active" data-view="dashboard">
                        <i class="fas fa-th-large"></i>
                        <span>Dashboard</span>
                    </li>
                    <li class="nav-item" data-view="employees">
                        <i class="fas fa-user-tie"></i>
                        <span>Employees</span>
                    </li>
                    <li class="nav-item" data-view="attendance">
                        <i class="fas fa-calendar-check"></i>
                        <span>Attendance</span>
                    </li>
                    <li class="nav-item" data-view="payroll">
                        <i class="fas fa-money-check-alt"></i>
                        <span>Payroll</span>
                    </li>
                    <li class="nav-item" data-view="recruitment">
                        <i class="fas fa-user-plus"></i>
                        <span>Recruitment</span>
                    </li>
                    <li class="nav-item" data-view="performance">
                        <i class="fas fa-star"></i>
                        <span>Performance</span>
                    </li>
                    <li class="nav-item" data-view="leave">
                        <i class="fas fa-plane-departure"></i>
                        <span>Leave Management</span>
                    </li>
                    <li class="nav-item" data-view="reports">
                        <i class="fas fa-chart-line"></i>
                        <span>Analytics</span>
                    </li>
                    <li class="nav-item" data-view="settings">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </li>
                    <li class="nav-item" data-view="users">
                        <i class="fas fa-user-shield"></i>
                        <span>Users</span>
                    </li>
                    <li class="nav-item" data-view="audit">
                        <i class="fas fa-history"></i>
                        <span>Audit Logs</span>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <p>&copy; 2023 HRMS Pro</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumb">
                    <span class="text-muted">Pages</span> / <span id="current-page">Dashboard</span>
                </div>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search employee records...">
                </div>
                <div class="user-profile">
                    <div class="notifications">
                        <i class="fas fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="user-info">
                        <span class="user-name">Admin User</span>
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=0D8ABC&color=fff" alt="Avatar" class="avatar">
                    </div>
                </div>
            </header>

            <div id="app-content" class="content-body">
                <!-- Content will be dynamically injected here by JS modules -->
                <div class="loader-container">
                    <div class="spinner"></div>
                    <p>Syncing with NetSuite...</p>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Application Scripts -->
    <script>window.__API_BASE__ = '/api';</script>
    <!-- db-shim.js: Compatibility shim mapping window.db to backend API (falls back to localStorage) -->
    <script src="db-shim.js"></script>
    <!-- ui.js: Shared UI Helper Functions -->
    <script src="ui.js"></script>
    <!-- NetSuite Integration Module -->
    <script src="netsuite.js"></script>
    <!-- API Adapter for Dynamic Data Loading -->
    <script src="api-adapter.js"></script>
    <!-- Integration Framework (Slack, HubSpot, Salesforce, etc) -->
    <script src="integrations.js"></script>
    <!-- Advanced Features (Performance, Skills, Training, etc) -->
    <script src="features.js"></script>
    <!-- Module Scripts -->
    <script src="employees.js"></script>
    <script src="attendance.js"></script>
    <script src="payroll.js"></script>
    <script src="leave.js"></script>
    <script src="reports.js"></script>
    <script src="admin.js"></script>
    <!-- app.js: Main Orchestrator and Routing -->
    <script src="app.js"></script>
    <!-- simple auth UI -->
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
